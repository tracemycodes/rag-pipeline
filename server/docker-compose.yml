version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: rag-pipeline-db
    environment:
      POSTGRES_USER: newapple
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_pipeline
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapple"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
